<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ポケトークWをandroidスマホ化した件 - 機械もの漁り</title>
    <style>
        /* 軽さを最優先し、メインサイトと完全に統一した黒ベースのスタイル */
        body {
            background-color: #000000;
            color: #FFA500; /* アンバー */
            font-family: "MS Pゴシック", monospace;
            margin: 0;
            padding: 40px 20px;
            text-align: center;
        }

        /* 記事の枠 */
        .post {
            border: 1px solid #FFA500;
            background-color: #020202;
            padding: 25px;
            margin: 0 auto;
            max-width: 650px;
            text-align: left;
        }
        .post-date {
            color: #888888;
            font-size: 12px;
            border-bottom: 1px dashed #333333;
            padding-bottom: 5px;
            margin-bottom: 15px;
        }
        .post-title {
            color: #FFFFFF;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .post-body {
            line-height: 1.8;
            font-size: 14px;
        }

        /* 戻るリンク */
        .back-link {
            color: #00FFFF;
            text-decoration: underline;
            font-size: 13px;
            display: inline-block;
            margin-top: 30px;
        }
        .back-link:hover {
            color: #FFFF00;
        }
 /* サイト全体の文字サイズや余白 */
  body {
    font-size: 16px;      /* スマホで見やすい文字の大きさ */
    line-height: 1.6;     /* 行と行の間隔をあけて読みやすく */
    padding: 15px;        /* 画面の端に少し余白を作る */
    margin: 0;
  }

  /* 画像が画面からはみ出さないようにする設定 */
  img {
    max-width: 100%;      /* 画面（または親要素）より大きくならない */
    height: auto;         /* 縦横比を崩さない */
    display: block;       /* レイアウトを綺麗に整える */
    margin: 10px 0;       /* 上下に少し隙間をあける */
  }



        
body.light-theme,
body.light-theme * {
  background-color: #ffffff !important; /* すべての背景を強制的に白にする */
  color: #222222 !important;            /* すべての文字を強制的に濃いグレーにする */
}

/* 見出し（タイトル）だけは、白背景でも目立つように濃いオレンジにする */
body.light-theme h1,
body.light-theme h2,
body.light-theme h3 {
  color: #d35400 !important;
  border-color: #d35400 !important;
}

/* リンクだけは、分かりやすいように青色にする */
body.light-theme a {
  color: #0066cc !important;
}

    </style>
</head>
<body>

    <!-- 記事エリア -->
    <div class="post">
        <div class="post-date">CATEGORY: COLUMN // RETRO_PC_LOG</div>
        <h1 class="post-title">■ ポケトークWをAndroidスマホ化した件</h1>
        <!-- 💡 本文の中の好きな場所に貼り付ける -->
<button id="theme-btn" style="padding: 5px 10px; cursor: pointer; margin-bottom: 15px;">ライトモードに切り替え</button>

        
        <div class="post-body">
            <h1>移行について</h1>
            この記事は<a href="https://w8017276487.hatenablog.com/entry/2026/10/12/202331">https://w8017276487.hatenablog.com/entry/2026/10/12/202331</a>に移行しました。
        </div>
    </div>

    <!-- 元のメインサイト（index.html）へ戻るリンク -->
    <!-- target="_top" をつけることで、フレーム（左右分割）を維持したまま、または解除して戻る設定にできます -->
    <a href="index.html" class="back-link">[ メインサイトへ戻る ]</a>

</body>
    <script>
  const btn = document.getElementById('theme-btn');
  
  btn.addEventListener('click', () => {
    // bodyタグに「light-theme」というクラスをつけ外しする
    document.body.classList.toggle('light-theme');
    
    // ボタンの文字を現在のモードに合わせて変える
    if (document.body.classList.contains('light-theme')) {
      btn.innerText = 'ダークモードに切り替え';
    } else {
      btn.innerText = 'ライトモードに切り替え';
    }
  });
</script>
</html>
